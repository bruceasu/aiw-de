<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" th:content="${csrfToken}"><meta name="question-can-operate" th:content="${questionCanOperate}"><meta name="question-can-approve" th:content="${questionCanApprove}"><title>工作问题与人工控制</title><link rel="stylesheet" href="/ui/console.css"><script src="/ui/questions.js" defer></script></head>
<body><main class="main workspace-page"><header class="topbar"><div><h1>工作问题与人工控制</h1><p>控制台、个人秘书和绑定的 Telegram 私聊使用同一问题及原始回答。</p></div><a href="/ui/authority">授权与预算</a><a href="/ui/configurations">专业配置</a></header>
<section class="card"><label class="field">计划<select id="question-plan"><option th:each="plan:${questionPlans}" th:value="${plan}" th:text="${plan}"></option></select></label><button id="question-refresh">刷新问题与进度</button><p id="question-status" role="status" class="help"></p></section>
<section id="question-list" class="section"></section>
<section class="card section"><h2>执行控制</h2><p>暂停停止新领取及推进，在途按已有授权收尾。取消提交停止请求；在途执行仍需真实确认。UNKNOWN 项目请到授权页核对，不会自动回滚或重放。</p><button data-control="pause">暂停新工作</button><button data-control="resume">恢复推进</button><button data-control="cancel">取消并等待停止确认</button><pre id="question-progress"></pre></section>
<section class="card section"><h2>Telegram 私聊</h2><p>明确填写个人用户 ID 和私聊 ID。改绑或解绑使旧关联失效。启用 bot 后才会发送；送达 UNKNOWN 需人工核对。每个问题可单独选择发送。</p><form id="question-binding" class="form-grid"><label class="field">用户 ID<input name="userId" required pattern="[1-9][0-9]*"></label><label class="field">私聊 ID<input name="privateChatId" required pattern="[1-9][0-9]*"></label><button>绑定此私聊</button></form><button id="question-unbind">解除当前绑定</button><pre id="question-telegram"></pre></section>
<section class="card section"><h2>提出具体追加申请</h2><p>申请本身不授予权限。审批显示维度、增加量和累计上限，多个渠道共用同一决定。</p><form id="question-budget" class="form-grid"><label class="field">维度<select name="dimension"><option>LOOP_BACKJUMPS</option><option>TIME_MS</option><option>TASKS</option><option>COST_MICROS</option></select></label><label class="field">循环 ID（仅循环）<input name="loopId"></label><label class="field">增加量<input name="amount" type="number" min="1" value="1" required></label><label class="field">追加后的累计上限<input name="cumulativeCeiling" type="number" min="1" required></label><label class="field">申请说明<textarea name="question" required maxlength="8000"></textarea></label><button>保存此范围的授权申请</button></form></section>
</main></body></html>
