<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Run · AI Dev Manager</title><link rel="stylesheet" href="/ui/console.css"></head><body><div class="app"><nav th:replace="~{ui/fragments :: nav('new-run')}"></nav><main class="main"><header th:replace="~{ui/fragments :: topbar('New Autonomous Run','Submit a requirement to the autonomous engineering control plane')}"></header><div class="content"><div th:replace="~{ui/fragments :: flash}"></div>
<div class="card form-card"><form action="/ui/runs" method="post"><input type="hidden" name="_csrf" th:value="${csrfToken}"/>
<div class="field full"><label for="requirement">Requirement</label><textarea id="requirement" name="requirement" rows="9" required placeholder="Describe the desired change, constraints and acceptance expectations."></textarea></div>
<div class="form-grid"><div class="field"><label for="repositoryRef">Workspace directory</label><input id="repositoryRef" name="repositoryRef" list="workspaceRefs" required placeholder="Choose a directory or enter a legacy ref"/><datalist id="workspaceRefs"><option th:each="target : ${workspaceTargets}" th:value="${target.repositoryRef}" th:label="${target.workspaceName + ' / ' + target.repoId + ' · ' + target.repositoryPath}"></option></datalist><div class="help"><a href="/ui/workspaces">Configure Workspaces</a>.</div></div><div class="field"><label for="baseRevision">Base Revision (optional)</label><input id="baseRevision" name="baseRevision" class="mono" placeholder="Leave empty to use the directory directly"/><div class="help">With a Git revision, the worker uses an isolated worktree.</div></div><div class="field"><label for="capabilities">Technical Capabilities</label><input id="capabilities" name="capabilities" placeholder="java, maven, sql"/></div><div class="field"><label for="priority">Priority</label><select id="priority" name="priority"><option>LOW</option><option selected>NORMAL</option><option>HIGH</option><option>CRITICAL</option></select></div><div class="field"><label for="maxParallelism">Run Max Parallelism</label><input id="maxParallelism" type="number" name="maxParallelism" value="1" min="0" max="1024"/><div class="help">Direct directory runs execute one task at a time.</div></div><div class="field"><label for="requestId">Request ID (optional)</label><input id="requestId" name="requestId" placeholder="feature-123"/></div></div>
<div class="form-actions"><button class="btn primary" type="submit">Start Autonomous Development</button><a class="btn ghost" href="/ui/runs">Cancel</a></div></form></div></div></main></div><script src="/ui/console.js"></script></body></html>
