<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runs · AI Dev Manager</title><link rel="stylesheet" href="/ui/console.css"></head><body><div class="app" data-auto-refresh="8"><nav th:replace="~{ui/fragments :: nav('runs')}"></nav><main class="main"><header th:replace="~{ui/fragments :: topbar('Autonomous Runs','Current and historical requirement execution')}"></header><div class="content"><div th:replace="~{ui/fragments :: flash}"></div><div class="page-actions"><input class="filter-input" type="search" placeholder="Filter runs..." data-table-filter="runs-table"/><a th:if="${canOperate}" class="btn primary" href="/ui/runs/new">New Run</a></div><div class="table-wrap"><table id="runs-table"><thead><tr><th>Run</th><th>Requirement</th><th>Phase</th><th>Status</th><th>Tasks</th><th>Progress</th><th>Scheduling</th><th>Updated</th></tr></thead><tbody><tr th:each="r : ${runs}"><td><a class="mono" th:href="@{/ui/runs/{id}(id=${r.runId})}" th:text="${r.runId}"></a></td><td class="truncate" th:text="${r.requirement}"></td><td th:text="${r.phase}"></td><td><span class="badge" th:text="${r.effectiveStatus}"></span></td><td th:text="${r.totalTasks}"></td><td><div class="progress"><span th:style="${'width:' + r.progressPercent() + '%'}"></span></div><div class="small muted" th:text="${r.completedTasks + ' complete · ' + r.activeTasks + ' active'}"></div></td><td class="small"><span th:text="${r.activeSlots}"></span> / <span th:text="${r.maxParallelism == 0 ? '∞' : r.maxParallelism}"></span></td><td class="small nowrap" th:text="${r.statusUpdatedAt}"></td></tr><tr th:if="${#lists.isEmpty(runs)}"><td colspan="8" class="empty">No autonomous runs yet.</td></tr></tbody></table></div><div class="footer-note"><span data-refresh-label>Refresh in 8s</span></div></div></main></div><script src="/ui/console.js"></script></body></html>
