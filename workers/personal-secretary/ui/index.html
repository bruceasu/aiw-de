<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的秘书</title><link rel="stylesheet" href="/console.css"><script src="/app.js" defer></script></head><body><main class="personal-shell"><header><h1>我的秘书</h1><p>对话、安排与策略保存在这台个人服务中。平台仅接收你已授权的固定业务动作。</p></header>
<p id="status" role="status"></p><section class="card"><h2>个人登录</h2><form data-route="login"><label>控制台一次性配对码<input name="code" type="password" autocomplete="one-time-code" required></label><button>登录我的服务</button></form></section>
<section class="card"><h2>执行控制</h2><p>服务重启后保持暂停。平台身份、能力和本地执行必须分别由你启用。</p><button id="enable">明确启用平台动作申请</button><button id="pause">暂停平台动作申请</button><button id="refresh">刷新私人状态</button><a href="/api/backup" download="personal-backup.json">下载私人备份</a></section>
<section class="card"><h2>私人工作与安排</h2><form data-route="work"><label>标题<input name="title" required maxlength="200"></label><label>私人说明<textarea name="body" maxlength="16000"></textarea></label><label>已在平台确认托管的 Plan ID（可选）<input name="planId"></label><button>保存私人工作</button></form>
<form data-route="schedule"><label>工作 ID<input name="workId" required></label><label>当前私人版本<input name="revision" type="number" required min="1"></label><label>安排时间<input name="dueMs" type="datetime-local" required></label><button>确认此时间与当前 Plan 内容</button></form></section>
<section class="card"><h2>私人对话</h2><form data-route="chat"><label>工作 ID<input name="workId" required></label><label>消息<textarea name="text" required maxlength="4000"></textarea></label><button>发送给个人模型</button></form></section>
<section class="card"><h2>私人代理策略</h2><p>文字不会创建平台权限。每条策略必须关联你在平台明确确认的固定授权。禁止投影提交后，平台目标保持暂停，需在平台明确交回。</p><form data-route="policy"><label>策略 ID<input name="id" required></label><label>当前版本（新策略为 0）<input name="revision" type="number" min="0" value="0" required></label><label>已确认的平台授权 ID<input name="grantId" required></label><label>私人策略原文<textarea name="originalText" required maxlength="16000"></textarea></label><label>私人策略到期时间（可选）<input name="expiresAt" type="datetime-local"></label><label>可选禁止投影（最小结构化范围 JSON，不含原文）<textarea name="deny"></textarea></label><label><input name="confirmed" type="checkbox" required>我确认此私人策略及其关联的精确平台能力</label><button>保存已确认策略</button></form>
<form data-route="queue-action"><label>已明确授予的固定能力 ID<input name="grantId" required></label><button>提交当前固定动作候选</button></form></section>
<section class="card"><h2>私人模板、草稿与待办</h2><form data-route="record"><label>类型<select name="kind"><option value="draft">草稿</option><option value="template">模板</option><option value="todo">待办</option></select></label><label>ID<input name="id" required></label><label>当前版本（新建为 0）<input name="revision" type="number" min="0" value="0" required></label><label>私人内容（JSON 对象）<textarea name="data" required>{"text":""}</textarea></label><button>保存私人记录</button></form></section>
<section class="card"><h2>取消私人安排或撤销私人策略</h2><p>停止本地新请求，保留已发送请求的对账。已在平台生效或运行中的动作不会回滚；需要停止时请在平台接管或停止 Plan。</p><form data-route="cancel"><label>类型<select name="kind"><option value="work">私人工作</option><option value="policy">私人策略</option></select></label><label>ID<input name="id" required></label><label>当前版本<input name="revision" type="number" min="1" required></label><button>确认本地取消或撤销</button></form></section>
<section class="card"><h2>私人状态与平台回执副本</h2><pre id="state">请先登录。</pre></section></main></body></html>
